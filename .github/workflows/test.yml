name: test
on:
  push:
  pull_request:

permissions:
  contents: read

# angerona's own tests.
jobs:
  bats:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The Rust that rust-toolchain.toml names, with its components.
      - run: rustup toolchain install
      - name: Install bats
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install bats-core; else sudo apt-get update && sudo apt-get install -y bats; fi
      - run: git --version && cargo test --locked
      - run: cargo test --locked -- --ignored network
      - run: cargo build --locked
      - run: cargo build --release --locked
      # Older, the tests that need config hooks skip, and CI would pass unseen.
      - name: git is 2.54 or later
        run: git --version | awk '{split($3, v, "."); exit !(v[1] > 2 || (v[1] == 2 && v[2] >= 54))}'
      - run: bats test/
      # github-emails is off by default and still built and tested on its own.
      - run: cargo clippy --all-targets --locked --features github-emails -- -D warnings
      - run: cargo test --locked --features github-emails
      - run: cargo build --locked --features github-emails
      - run: ANGERONA_FEATURES=github-emails bats test/
