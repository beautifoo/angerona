name: test
on:
  push:
  pull_request:

permissions:
  contents: read

# The guard's own tests, against a fake term list.
jobs:
  bats:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install bats
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install bats-core; else sudo apt-get update && sudo apt-get install -y bats; fi
      - run: git --version && cargo test --locked
      - run: cargo build --release --locked
      # Older, the tests that need config hooks skip, and CI would pass unseen.
      - name: git is 2.54 or later
        run: git --version | awk '{split($3, v, "."); exit !(v[1] > 2 || (v[1] == 2 && v[2] >= 54))}'
      - run: AG=$PWD/target/release/angerona bats test/
      # The static curl must come with TLS: the push check asks GitHub over https.
      - name: The release build speaks https
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/config/angerona" && echo zorblax >"$RUNNER_TEMP/config/angerona/terms.txt"
          git init -q "$RUNNER_TEMP/h" && cd "$RUNNER_TEMP/h" && git -c user.name=t -c user.email=t@t commit -q --allow-empty -m x
          printf 'refs/heads/x %s refs/heads/x %040d\n' "$(git rev-parse HEAD)" 0 |
            XDG_CONFIG_HOME=$RUNNER_TEMP/config "$GITHUB_WORKSPACE/target/release/angerona" check-push origin https://github.com/rust-lang/rust.git 2>err
          ! grep -q "can't ask" err
