[package]
name = "angerona"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Keeps your emails, home path, login and machine name out of what you publish with git"
repository = "https://github.com/beautifoo/angerona"
homepage = "https://beauti.foo/projects/angerona"
license = "MIT"

[dependencies]
gix = { version = "0.90", default-features = false, features = ["sha1", "index", "status", "credentials", "blocking-network-client", "blocking-http-transport-curl"] }
regex = "1"
curl = { version = "0.4", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
curl = { version = "0.4", features = ["ssl", "static-curl", "static-ssl"] }

[profile.release]
strip = "none"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.rust]
# codesign -f in .cargo/link-hardened says it replaced the linker's signature.
linker_messages = "allow"
