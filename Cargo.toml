[package]
name = "angerona"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
gix = { version = "0.90", default-features = false, features = ["sha1", "index", "status"] }
regex = "1"

[profile.release]
strip = "none"

[lints.rust]
# codesign -f in .cargo/link-hardened says it replaced the linker's signature.
linker_messages = "allow"
