[package]
name = "angerona"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Keeps the terms on a private list out of what you publish with git and MCP"
repository = "https://github.com/beautifoo/angerona"
license = "MIT"

[dependencies]
aho-corasick = "1"
gix = { version = "0.90", default-features = false, features = ["sha1", "index", "status", "credentials", "blocking-network-client", "blocking-http-transport-curl"] }
regex = "1"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
curl = { version = "0.4", default-features = false, features = ["ssl", "static-curl", "static-ssl"] }

[profile.release]
strip = "none"

[lints.rust]
# codesign -f in .cargo/link-hardened says it replaced the linker's signature.
linker_messages = "allow"
